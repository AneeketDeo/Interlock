services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: rca-timescaledb
    environment:
      POSTGRES_USER: ${TIMESCALE_USER:-rca}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-rca_password}
      POSTGRES_DB: ${TIMESCALE_DB:-rca_sentinel}
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALE_USER:-rca} -d ${TIMESCALE_DB:-rca_sentinel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rca-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rca-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - TIMESCALE_HOST=timescaledb
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  mcp-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rca-mcp-server
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - TIMESCALE_HOST=timescaledb
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: python -m app.mcp_server.server

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rca-worker
    env_file:
      - .env
    environment:
      - TIMESCALE_HOST=timescaledb
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: python -m app.detection.stream_consumer

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rca-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  timescale_data:
  redis_data:
